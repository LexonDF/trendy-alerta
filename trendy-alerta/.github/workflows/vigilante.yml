name: Vigilante Trendy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vigilante-trendy
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Revisar la tienda
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py --loop 240 --every 45

      - name: Guardar estado (solo si cambió)
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "vigilante-trendy"
            git config user.email "vigilante@users.noreply.github.com"
            git add state.json
            git commit -m "estado del vigilante"
            git pull --rebase -q || true
            git push || true
          fi
